<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <style>
    * { box-sizing: border-box; }
    html { overflow-x: hidden; }
    body {
      margin: 0;
      padding: 32px 16px 72px;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      color: #51608a;
      background: linear-gradient(180deg, #bfe0fa 0%, #d9d4f6 50%, #f9d3e2 100%);
      background-attachment: fixed;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .scene {
      position: relative;
      max-width: 520px;
      margin: 0 auto;
      padding-top: 8px;
    }
    h1 {
      position: relative;
      z-index: 1;
      margin: 0 0 18px;
      text-align: center;
      font-size: 28px;
      font-weight: 600;
      color: #51608a;
    }

    /* Soft decorative clouds (phone corners, laptop sides) */
    .bg-cloud {
      position: absolute;
      width: 90px;
      height: 32px;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.6);
    }
    .bg-cloud::before,
    .bg-cloud::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
    }
    .bg-cloud::before { width: 38px; height: 38px; top: -18px; left: 14px; }
    .bg-cloud::after  { width: 28px; height: 28px; top: -12px; left: 48px; }
    .bg-cloud.a { top: 0; left: -30px; }
    .bg-cloud.b { top: 110px; right: -30px; transform: scale(0.8); }
    @media (min-width: 700px) {
      .bg-cloud.a { left: -170px; top: 20px; transform: scale(1.5); }
      .bg-cloud.b { right: -170px; top: 160px; transform: scale(1.2); }
    }

    /* Pill search bar with the button tucked inside the right end */
    .pill {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      padding: 6px 6px 6px 22px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(150, 165, 215, 0.3);
    }
    .pill input {
      flex: 1;
      min-width: 0;
      font-size: 16px;
      color: #51608a;
      border: none;
      background: transparent;
      outline: none;
    }
    .pill input::placeholder { color: #aab6d2; }
    .pill button {
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #8fc3f0, #f2a3c3);
      border: none;
      border-radius: 999px;
      cursor: pointer;
    }

    /* Plain-text problem message under the search box */
    .message {
      position: relative;
      z-index: 1;
      margin: 18px 0 0;
      text-align: center;
      font-size: 17px;
      color: #6a5a82;
    }
    .message:empty { display: none; }

    /* Weather result card */
    .card {
      position: relative;
      z-index: 1;
      margin-top: 78px;
      padding: 62px 24px 28px;
      text-align: center;
      background: rgba(255, 255, 255, 0.88);
      border-radius: 30px;
      box-shadow: 0 14px 34px rgba(150, 165, 215, 0.3);
    }
    .card[hidden] { display: none; }

    /* Weather icon in a soft round badge overlapping the card's top edge */
    .icon-badge {
      position: absolute;
      top: -48px;
      left: 50%;
      width: 96px;
      height: 96px;
      margin-left: -48px;
      border-radius: 50%;
      background: #e8f2fd;
      box-shadow: 0 0 0 10px rgba(255, 227, 166, 0.5), 0 5px 12px rgba(150, 175, 225, 0.35);
    }
    .icon-badge img {
      display: block;
      width: 64px;
      height: 64px;
      margin: 16px;
    }

    .city { margin: 0; font-size: 24px; font-weight: 600; }
    .country { font-size: 17px; font-weight: 400; color: #8f9bbb; }
    .time { margin: 2px 0 0; font-size: 14px; color: #8f9bbb; }
    .temp { margin: 2px 0; font-size: 60px; font-weight: 300; color: #6679b0; }
    .desc { margin: 0 0 18px; font-size: 17px; color: #8f9bbb; }
    .row { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
    .chip {
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 15px;
      background: #f7eefa;
    }
    .chip b { color: #6679b0; }
  </style>
</head>
<body>
  <main class="scene">
    <div class="bg-cloud a"></div>
    <div class="bg-cloud b"></div>
    <h1>Weather App</h1>
    <form class="pill" id="search-form">
      <input type="text" id="city-input" placeholder="Type a city name" aria-label="City name">
      <button type="submit">Search</button>
    </form>
    <p class="message" id="message"></p>
    <section class="card" id="result" hidden>
      <div class="icon-badge"><img id="icon" src="" alt=""></div>
      <p class="city"><span id="city"></span> <span class="country" id="country"></span></p>
      <p class="time" id="time"></p>
      <p class="temp" id="temp"></p>
      <p class="desc"><span id="desc"></span> · feels like <span id="feels"></span></p>
      <div class="row">
        <div class="chip">Humidity <b id="humidity"></b></div>
        <div class="chip">Wind <b id="wind"></b></div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
