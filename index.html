<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="sun">🌤️</div>
    <h1>Weather <span>App</span></h1>
    <p>Type a city to see its weather.</p>
    <div class="search">
      <input type="text" placeholder="Search for a city..." aria-label="City">
      <button type="button">Search</button>
    </div>
  </header>
  <main class="card">
    <span class="big">🌍</span>
    <h2>Where to?</h2>
    <p>Your weather will appear here.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
