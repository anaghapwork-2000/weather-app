<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup 1 - Morning Postcard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 16px 64px;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      color: #4a5a78;
      background: linear-gradient(160deg, #cfe8fb 0%, #e3dcf7 55%, #fadbe6 100%);
      background-attachment: fixed;
      min-height: 100vh;
    }
    .view-label {
      max-width: 460px;
      margin: 40px auto 12px;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #7d8db0;
    }
    .view-label:first-of-type { margin-top: 0; }

    .card {
      max-width: 460px;
      margin: 0 auto;
      padding: 28px 24px 32px;
      background: rgba(255, 255, 255, 0.82);
      border-radius: 28px;
      box-shadow: 0 12px 36px rgba(140, 160, 210, 0.25);
    }
    .card h1 {
      margin: 0 0 20px;
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      color: #5b6fa0;
    }

    /* Search row: stacked on phones, side by side on laptops */
    .search { display: flex; flex-direction: column; gap: 12px; }
    .search input {
      width: 100%;
      padding: 14px 18px;
      font-size: 16px;
      color: #4a5a78;
      background: #f4f8fe;
      border: 2px solid #d6e6f8;
      border-radius: 16px;
    }
    .search input::placeholder { color: #a4b3cf; }
    .search button {
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #9cc9f2, #f2a9c6);
      border: none;
      border-radius: 16px;
    }
    @media (min-width: 600px) {
      .search { flex-direction: row; }
      .search input { flex: 1; }
    }

    .area { margin-top: 28px; text-align: center; }

    /* Drawn weather picture: sun peeking behind a cloud */
    .wx { position: relative; width: 120px; height: 84px; margin: 0 auto 8px; }
    .sun {
      position: absolute; top: 0; right: 10px;
      width: 54px; height: 54px; border-radius: 50%;
      background: #ffe2a0;
      box-shadow: 0 0 0 9px rgba(255, 226, 160, 0.45);
    }
    .cloud {
      position: absolute; bottom: 0; left: 8px;
      width: 86px; height: 36px; border-radius: 36px;
      background: #dcecfb;
      box-shadow: 0 4px 10px rgba(140, 170, 220, 0.3);
    }
    .cloud::before, .cloud::after {
      content: ""; position: absolute; border-radius: 50%; background: #dcecfb;
    }
    .cloud::before { width: 40px; height: 40px; top: -20px; left: 12px; }
    .cloud::after  { width: 30px; height: 30px; top: -13px; left: 46px; }

    .city { margin: 0; font-size: 24px; font-weight: 600; color: #4a5a78; }
    .temp { margin: 4px 0; font-size: 64px; font-weight: 300; color: #5b6fa0; line-height: 1.1; }
    .desc { margin: 0 0 20px; font-size: 17px; color: #8a97b5; }
    .details { display: flex; justify-content: center; gap: 12px; }
    .detail {
      flex: 1; max-width: 160px; padding: 12px 8px;
      background: #f6f1fb; border-radius: 16px; font-size: 15px;
    }
    .detail b { display: block; font-size: 18px; color: #5b6fa0; }

    .message { padding: 8px 0; font-size: 17px; color: #7d8db0; }
    .message small { display: block; margin-top: 6px; font-size: 14px; color: #a4b3cf; }
    .dots span {
      display: inline-block; width: 10px; height: 10px; margin: 0 4px;
      border-radius: 50%; background: #b9d6f5;
    }
    .dots span:nth-child(2) { background: #d7c9f2; }
    .dots span:nth-child(3) { background: #f4bfd4; }
  </style>
</head>
<body>

  <div class="view-label">Before searching</div>
  <div class="card">
    <h1>Weather App</h1>
    <div class="search">
      <input type="text" placeholder="Type a city name" aria-label="City name">
      <button type="button">Search</button>
    </div>
  </div>

  <div class="view-label">Loading...</div>
  <div class="card">
    <h1>Weather App</h1>
    <div class="search">
      <input type="text" value="Rosewood Bay" aria-label="City name">
      <button type="button">Search</button>
    </div>
    <div class="area message">
      <div class="dots"><span></span><span></span><span></span></div>
      <p>Loading...</p>
    </div>
  </div>

  <div class="view-label">Weather result</div>
  <div class="card">
    <h1>Weather App</h1>
    <div class="search">
      <input type="text" value="Rosewood Bay" aria-label="City name">
      <button type="button">Search</button>
    </div>
    <div class="area">
      <div class="wx"><div class="sun"></div><div class="cloud"></div></div>
      <p class="city">Rosewood Bay</p>
      <p class="temp">24°C</p>
      <p class="desc">Partly cloudy</p>
      <div class="details">
        <div class="detail"><b>58%</b>Humidity</div>
        <div class="detail"><b>12 km/h</b>Wind</div>
      </div>
    </div>
  </div>

  <div class="view-label">City not found</div>
  <div class="card">
    <h1>Weather App</h1>
    <div class="search">
      <input type="text" value="Rosewod Bay" aria-label="City name">
      <button type="button">Search</button>
    </div>
    <div class="area message">
      <div class="wx" style="height:56px"><div class="cloud" style="left:17px"></div></div>
      <p>We couldn't find that city.</p>
      <small>Please check the spelling and try again.</small>
    </div>
  </div>

</body>
</html>
